spring:
  application:
    name: match-service

  config:
    import: optional:configserver:http://localhost:10002

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18080/realms/ticketing

  kafka:
    consumer:
      # auto-commit 비활성화 — AckMode.RECORD 로 처리 완료 후 수동 커밋
      enable-auto-commit: false
      # 좌석 이벤트는 처리량이 크지 않으므로 50으로 제한
      max-poll-records: 50

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

topics:
  match:
    approved: match.approved
    canceled: match.canceled
  reservation:
    seat:
      reserved: reservation.seat.reserved
      released: reservation.seat.released